name: Build e publicar instalador Windows (SPCS - Automação Desktop)

# Roda num Windows de verdade (sem precisar de Wine) sempre que a
# versão em desktop/package.json mudar na branch main, ou manualmente
# pela aba Actions do GitHub ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'desktop/package.json'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Chave pública (anon) do Supabase — não é segredo, é a mesma que já
      # fica embutida em qualquer build do app (web/mobile/desktop).
      EXPO_PUBLIC_SUPABASE_URL: https://qpalyufeldkqculnixrn.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwYWx5dWZlbGRrcWN1bG5peHJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMDU3MTQsImV4cCI6MjExMDY4MTcxNH0.4CcSt4zl-eNTHhv98Pe5HnSfCErlwco20q_5Yecs4sI
      # Token automático do Actions — usado só para criar a release no GitHub
      # e subir o instalador nela (não precisa de nenhum segredo extra).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências do app (Expo)
        run: npm install

      - name: Gerar build web (Expo export)
        run: npx expo export --platform web

      - name: Instalar dependências do app desktop
        working-directory: desktop
        run: npm install

      - name: Gerar e publicar instalador Windows (.exe)
        working-directory: desktop
        run: npm run build:win

      - name: Guardar instalador como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: desktop/release/*.exe
